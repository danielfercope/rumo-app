# Override de produção (AWS) pro docker-compose.backend.yml — usado junto dele:
#   docker compose -f docker-compose.backend.yml -f docker-compose.prod.yml --env-file infra/.env up -d --build
#
# Diferenças do ambiente local:
# - dados do Postgres e certificados do Caddy em /mnt/rumo-data (volume EBS dedicado,
#   fora do volume root da instância — sobrevive a troca/substituição da instância);
# - portas internas (5432/3000/4000) não publicadas — só acessíveis entre os containers;
# - Caddy expõe 80/443 (TLS automático via Let's Encrypt), não 8080;
# - Caddy também serve o Flutter Web (/srv/web) e o APK (/srv/downloads), ambos no
#   volume EBS e preenchidos por `make deploy-web` / `make deploy-apk`;
# - logs de todos os containers no CloudWatch (grupo /rumo-app/backend, um stream
#   por serviço), via driver awslogs com as credenciais da role da EC2. O grupo e a
#   permissão vêm de infra/aws/logs-stack.yaml: crie essa stack ANTES do
#   primeiro `make deploy` com este arquivo, senão os containers não sobem.
#   `docker compose logs` continua funcionando (cache local do Docker).

x-awslogs: &awslogs
  awslogs-region: ${AWS_REGION:-us-east-1}
  awslogs-group: /rumo-app/backend
  # não trava o container se o CloudWatch ficar lento (descarta no limite do buffer)
  mode: non-blocking
  max-buffer-size: 4m

services:
  db:
    logging:
      driver: awslogs
      options:
        <<: *awslogs
        awslogs-stream: db
        # linhas de continuação (sem data no início) ficam no mesmo evento
        awslogs-datetime-format: '%Y-%m-%d %H:%M:%S'
    volumes:
      - /mnt/rumo-data/postgres:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    ports: !reset []

  postgrest:
    ports: !reset []
    logging:
      driver: awslogs
      options:
        <<: *awslogs
        awslogs-stream: postgrest

  backend:
    ports: !reset []
    logging:
      driver: awslogs
      options:
        <<: *awslogs
        awslogs-stream: backend
        # traceback do Python fica no mesmo evento da linha "ERROR:" que o abriu
        awslogs-multiline-pattern: '^(DEBUG|INFO|WARNING|ERROR|CRITICAL):'

  caddy:
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - /mnt/rumo-data/caddy:/data
      # Artefatos do frontend, sincronizados do S3 (make deploy-web / deploy-apk).
      - /mnt/rumo-data/web:/srv/web:ro
      - /mnt/rumo-data/downloads:/srv/downloads:ro
    logging:
      driver: awslogs
      options:
        <<: *awslogs
        awslogs-stream: caddy
    ports: !override
      - "80:80"
      - "443:443"
