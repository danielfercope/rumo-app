name: rumo_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  google_maps_flutter: ^2.10.1
  flutter_riverpod: ^2.6.1
  geolocator: ^14.0.2
  google_sign_in: ^6.2.2
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  url_launcher: ^6.3.1
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Save_Co._Simbolo_original_branco_escuro.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/Save_Co._Simbolo_outline_amarelo_escuro.png
    - assets/libria.png
    - assets/save_id.png
    - assets/icon_save.webp
